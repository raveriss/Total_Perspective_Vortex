[project]
name = "total-perspective-vortex"
version = "0.1.0"
description = "EEG Brain-Computer Interface pipeline for the Total Perspective Vortex project."
authors = [{ name = "raveriss", email = "you@example.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.3,<2.0",
    "mne>=1.6,<2.0",
    "matplotlib>=3.8,<4.0",
    "joblib>=1.4,<2.0",
    "tqdm>=4.67.1,<5.0",
    "urllib3>=2.6.3,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-timeout>=2.3,<3.0",
    "pytest-randomly>=3.15,<4.0",
    "hypothesis>=6.112,<7.0",
    "mypy>=1.11,<2.0",
    "ruff>=0.6,<0.7",
    "black>=26.3.1,<27.0",
    "isort>=5.13,<6.0",
    "bandit>=1.7,<2.0",
    "mutmut>=3.0,<4.0",
    "radon>=6.0,<7.0",
    "xenon>=0.9,<1.0",
    "pre-commit>=4.0,<5.0",
    "pip-audit>=2.7,<3.0",
    "coverage>=7.6,<8.0",
]

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
packages = ["src/tpv"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/tpv",
    "/scripts",
    "/tests",
    "/mybci.py",
    "/pyproject.toml",
    "/uv.lock",
    "/Makefile",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = "mutants"

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mybci", "tpv"]
src_paths = ["src", "scripts", "tests"]
skip = ["mutants", ".venv", ".uv-cache", "data", "artifacts", "tmp"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["mutants", ".venv", ".uv-cache", "data", "artifacts", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "PL", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["mybci", "tpv"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415", "B905", "E501", "PLR0913"]

[tool.mutmut]
paths_to_mutate = [
    "src/tpv",
    "mybci.py",
    "scripts",
]
also_copy = ["scripts", "src"]
pytest_add_cli_args = ["-q", "-k", "not latency_benchmark and not benchmark"]
mutate_only_covered_lines = true

[tool.pytest.ini_options]
pythonpath = ["src", ".", ".."]
testpaths = ["tests"]
addopts = [
  "-p", "no:launch_testing",
  "-p", "no:launch_ros",
  "--ignore=mutants",
]
norecursedirs = [
  "data",
  "mutants",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
strict_optional = true
no_implicit_optional = true
show_error_codes = true
pretty = true
ignore_missing_imports = true
files = "src scripts tests"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
source = ["src", "scripts"]

[tool.coverage.report]
omit = [
  "mutants/*",
  ".venv/*",
  "*/site-packages/*",
  "scripts/import_murphy_issues.py",
  "scripts/import_murphy_to_project.py",
]
